# SDP gate + escalation config (code checks only cardinality/parity; names here).
mode: unattended                # EXPLICIT (REQ-002). `attended` would reopen the override path REQ-019 forbids.
model: ""                       # sole reviewer-model source (claude+agy), never env; empty = provider default
claude_timeout: 300             # claude reviewer wall cap (s); clamped to GATE_WALL_BUDGET (550)
codex_timeout: 480              # codex reviewer wall cap (s); clamped to GATE_WALL_BUDGET (550)
agy_timeout: 30                 # was 300 — deliberate for this repo (ADR-B03): agy is a BLOCK signal here
require_primary_verdict: false  # true => an agy-fallback ALLOW is refused as INFRA_ERROR (ADR-G17)
cadence:
  escalate_from: 8              # planner-solo hard-blocked from this cumulative BLOCK
  review_on: even               # anchor parity picks the kind; see marker_span
  relaxation_ack: marker-fatigue-2026-08-12-user-approved-8-4
                                # REQUIRED: escalate_from/marker_span are past the
                                # shipped baseline (6/1), so sdp-regression.sh refuses
                                # to certify them unless the relaxation is declared
                                # here. Absence = FAIL, never a silent wider ceiling.
  marker_span: 4                # one accepted marker discharges this many consecutive
                                # rounds. With escalate_from 8 / max_block 13 the
                                # windows are 8-11 and 12-13, so exactly TWO markers
                                # cover the whole escalation range. Both anchors are
                                # even, so both are TEAM_REVIEW (outputs= required)
                                # and TEAM_CARRY never falls due here — intended.
halt:
  max_block: 13                 # 12th review executes; 13th entry halts (D-07)
  pivot_cap: 2
  split_depth_cap: 2         # halt-recovery split: chain depth an artifact may be
                                # split to (0 = original). 2 allows original -> children ->
                                # grandchildren and refuses the next. Uncapped, the split
                                # path would be an unlimited counter reset.
  max_stall: 5                  # consecutive ESCALATION_STALLs before .halt (absent-key default is 5)
require_checklist: false        # migrated-off-old-core projects set true
# review_checklist_include: .sdp/project-rules.md   # OPTIONAL — set only if file exists
infra_error_policy:
  attended: warn_flag_continue  # stage may advance; merge/push refused while infra_flag exists
  unattended: pause_notify
