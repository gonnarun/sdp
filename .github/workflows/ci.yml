name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to a commit SHA, not a tag: a tag is mutable and can
      # be repointed at new code after review. This repo's whole premise is that
      # a reviewer binary must resolve through a trusted path, so trusting a
      # movable ref here would be inconsistent. The trailing comment is the human
      # -readable version; bump both together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 3.9 is the MINIMUM version README claims support for, so that is what
          # CI proves. Newer interpreters are a superset for stdlib-only code.
          python-version: '3.9'

      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      # No reviewer CLI (codex / claude) and no tmux are installed here, by
      # design: CI must not depend on an authenticated model account. The gate
      # suites drive review_gate.py through tests/lib/harness.py's stub binary
      # resolver, so they run fully. Two assertions self-skip in this
      # environment and say so in the log — smoke.sh's doctor toolchain axis and
      # tests/run_segment.sh's MODE logic. Everything else is exercised.

      # Fails on a stale root mirror, an orphaned test suite, a packaging
      # regression, a smoke failure, or a shellcheck finding.
      - name: Fast suite
        run: bash tests/run.sh --fast

      # Every layer in .sdp/defaults.yaml. No network, no model calls.
      - name: Full suite
        run: bash tests/run.sh
