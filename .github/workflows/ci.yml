name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to a commit SHA, not a tag: a tag is mutable and can
      # be repointed at new code after review. This repo's whole premise is that
      # a reviewer binary must resolve through a trusted path, so trusting a
      # movable ref here would be inconsistent. The trailing comment is the human
      # -readable version; bump both together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 3.9 is the MINIMUM version README claims support for, so that is what
          # CI proves. Newer interpreters are a superset for stdlib-only code.
          python-version: '3.9'

      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      # No reviewer CLI (codex / claude) and no tmux are installed here, by
      # design: CI must not depend on an authenticated model account. The gate
      # suites drive review_gate.py through tests/lib/harness.py's stub binary
      # resolver, so they run fully. Two assertions self-skip in this
      # environment and say so in the log — smoke.sh's doctor toolchain axis and
      # tests/run_segment.sh's MODE logic. Everything else is exercised.

      # Fails on a stale root mirror, an orphaned test suite, a packaging
      # regression, a smoke failure, or a shellcheck finding.
      - name: Fast suite
        run: bash tests/run.sh --fast

      # Every layer in .sdp/defaults.yaml. No network, no model calls.
      - name: Full suite
        run: bash tests/run.sh

  # ---------------------------------------------------------------- Windows --
  # The POSIX suite is NOT run here. It asserts symlinks, chmod semantics and
  # fcntl, none of which mean the same thing on Windows, so running it would
  # produce failures that say nothing about the port. What runs instead is the
  # ADR-W10 acceptance matrix -- the cases that only a real Windows interpreter
  # can answer, which every other test in this repository can only simulate.
  #
  # A11 (substitution by a second local account) is not automatable on a shared
  # runner, and the Codex hook end-to-end needs an authenticated Codex CLI, so
  # both stay unrun and KNOWN_GAPS NC-30 continues to say so.
  windows-acceptance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Same floor the POSIX jobs prove. The port is stdlib-only, so the
          # minimum is the version that matters.
          python-version: '3.9'

      # A1/A2: the mandatory first step of /sdp:sdp, under Git Bash -- the only
      # Windows invocation the plugin claims to support (ADR-W08).
      - name: Anchor under Git Bash
        shell: bash
        run: |
          set -eu
          out="$(CLAUDE_PROJECT_DIR="$PWD" bash scripts/sdp-anchor.sh)"
          echo "anchor said: $out"
          test -f "$out" || { echo "A1 FAILED: no runtime env written"; exit 1; }
          grep -q '^BASE_DIR=' "$out" || { echo "A1 FAILED: no BASE_DIR"; exit 1; }
          echo "ok - [A1] the anchor writes a runtime env on Windows"

      - name: Native Windows base_dir fails closed
        shell: bash
        run: |
          set -eu
          mkdir -p .sdp-a2/.sdp
          printf 'base_dir: C:\\Users\\evil\n' > .sdp-a2/.sdp/defaults.yaml
          if CLAUDE_PROJECT_DIR="$PWD/.sdp-a2" bash scripts/sdp-anchor.sh >/dev/null 2>a2.err; then
            echo "A2 FAILED: a native C:\ base_dir was accepted"; cat a2.err; exit 1
          fi
          grep -qi 'native Windows path' a2.err \
            && echo "ok - [A2] a native C:\\ base_dir fails closed naming the MSYS form" \
            || { echo "A2 FAILED: wrong diagnostic"; cat a2.err; exit 1; }

      # A3-A10, A12-A15. Gate cases fail the job; measurements only report.
      - name: Acceptance matrix
        run: python tests/win_native.py

      # The launcher the hooks go through, on the interpreter naming that made
      # this necessary: python3 is not a guaranteed name here.
      #
      # What is under test is the LAUNCHER CONTRACT -- did it resolve a Python and
      # run the hook -- not whether precompact automation happens to be enabled.
      # `doctor` exits 1 on a fresh runner because mode is unset, which is the
      # documented fail-close default; asserting on its exit status would be
      # asserting on configuration, and 127 is the launcher's own "no interpreter
      # found" code, so that is the status that actually means failure here.
      - name: Hook launcher resolves an interpreter
        shell: bash
        run: |
          set -eu
          set +e
          echo '{}' | bash scripts/precompact_launcher.sh doctor > l.out 2>&1
          rc=$?
          set -e
          cat l.out
          [ "$rc" -ne 127 ] || { echo "FAILED: the launcher found no interpreter"; exit 1; }
          grep -q 'state dir' l.out \
            || { echo "FAILED: the hook did not run through the launcher"; exit 1; }
          echo "ok - the launcher resolved a Python and ran the hook (doctor rc=$rc)"

      # The loud-failure contract: an unresolvable interpreter must never look like
      # a hook that ran and did nothing. That silent shape is the whole reason the
      # Codex Windows hook bug is hard to notice.
      - name: Hook launcher fails loudly with no interpreter
        shell: bash
        run: |
          set -eu
          set +e
          env PATH=/nonexistent /usr/bin/bash scripts/precompact_launcher.sh stop </dev/null >n.out 2>&1
          rc=$?
          set -e
          cat n.out
          [ "$rc" -eq 127 ] || { echo "FAILED: expected 127, got $rc"; exit 1; }
          grep -qi 'no Python' n.out \
            || { echo "FAILED: no diagnostic on stderr"; exit 1; }
          echo "ok - no interpreter resolvable -> exit 127 with a diagnostic, never a silent 0"
